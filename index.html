<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#208b98">
<meta name="description" content="Stickman Hook - Fast-paced physics swinging arcade PWA game">
<!-- Apple PWA Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stickman Hook">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23208b98'><circle cx='50' cy='50' r='50'/><circle cx='50' cy='30' r='12' fill='%23fff'/><path d='M50 42 L50 75 M50 55 L30 40 M50 55 L70 40 M50 75 L35 95 M50 75 L65 95' stroke='%23fff' stroke-width='6' stroke-linecap='round'/></svg>">

<title>Stickman Hook PWA</title>

<!-- Dynamic PWA Manifest Placeholder -->
<link rel="manifest" id="manifest-link">

<style>
  :root {
    --bg-theme: #208b98;
    --ui-white: #ffffff;
    --ui-dark: #333333;
    --accent-green: #4cd964;
    --accent-blue: #007aff;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1a1a1a;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  }

  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* TOP UI OVERLAY */
  #top-ui {
    position: absolute;
    top: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 10;
    pointer-events: none;
  }

  .ui-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ui-btn {
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease, background-color 0.15s;
    border: none;
  }

  .ui-btn:active {
    transform: scale(0.9);
  }

  .ui-btn svg {
    width: 22px;
    height: 22px;
    fill: #333;
  }

  .ui-btn.pwa-badge {
    position: relative;
  }

  .ui-btn.pwa-badge::after {
    content: '';
    position: absolute;
    top: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    background: var(--accent-green);
    border-radius: 50%;
    border: 2px solid #fff;
  }

  /* Level Progress Bar */
  #progress-container {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.25);
    padding: 8px 18px;
    border-radius: 30px;
    backdrop-filter: blur(6px);
    pointer-events: auto;
  }

  .level-num {
    color: #ffffff;
    font-weight: 800;
    font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  #progress-bar-bg {
    position: relative;
    width: 130px;
    height: 8px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 4px;
    overflow: visible;
  }

  #progress-bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #ffffff;
    border-radius: 4px;
    transition: width 0.1s linear;
  }

  #progress-player-dot {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 16px;
    height: 16px;
    background: #ffffff;
    border: 3px solid #333333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: left 0.1s linear;
  }

  /* Instruction Hint Overlay */
  #instruction-hint {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.4);
    color: #ffffff;
    padding: 10px 22px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    pointer-events: none;
    transition: opacity 0.4s ease;
    backdrop-filter: blur(4px);
  }

  /* MODALS & OVERLAYS */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 28px;
    width: 88%;
    max-width: 440px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 36px rgba(0,0,0,0.3);
    transform: translateY(20px);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden;
  }

  .modal-overlay.active .modal-card {
    transform: translateY(0);
  }

  .modal-title {
    font-size: 24px;
    font-weight: 900;
    color: #222;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }

  .modal-subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 18px;
    font-weight: 600;
    text-align: center;
  }

  .primary-btn {
    width: 100%;
    padding: 14px 20px;
    background: var(--accent-green);
    border: none;
    border-radius: 14px;
    color: #ffffff;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(76, 217, 100, 0.4);
    transition: transform 0.15s ease, background 0.15s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .primary-btn:active {
    transform: scale(0.96);
  }

  .secondary-btn {
    width: 100%;
    padding: 12px 18px;
    background: #e5e5ea;
    border: none;
    border-radius: 12px;
    color: #333;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.15s;
  }

  .secondary-btn:hover {
    background: #d1d1d6;
  }

  /* Level Select Grid */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
    max-height: 260px;
    overflow-y: auto;
    padding: 6px;
  }

  .level-node {
    aspect-ratio: 1;
    background: #f0f0f5;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    font-size: 15px;
    color: #444;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    border: 2px solid transparent;
  }

  .level-node.current {
    background: #208b98;
    color: #fff;
    box-shadow: 0 4px 10px rgba(32, 139, 152, 0.4);
    border-color: #ffffff;
  }

  .level-node .diff-indicator {
    font-size: 9px;
    font-weight: 600;
    opacity: 0.75;
    margin-top: 2px;
  }

  .level-node:active {
    transform: scale(0.9);
  }

  /* Level Title Banner Overlay */
  #level-banner {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    letter-spacing: 2px;
    z-index: 12;
    text-transform: uppercase;
  }
  #level-banner.show {
    opacity: 1;
    transform: translate(-50%, -60%);
  }

  /* PWA Code Viewer Tabs */
  .pwa-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
  }

  .pwa-tab-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    background: #f0f0f5;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    color: #555;
    cursor: pointer;
  }

  .pwa-tab-btn.active {
    background: var(--accent-blue);
    color: #fff;
  }

  .code-container {
    background: #1e1e1e;
    color: #d4d4d4;
    border-radius: 12px;
    padding: 12px;
    font-family: monospace;
    font-size: 11px;
    line-height: 1.4;
    height: 200px;
    overflow: auto;
    text-align: left;
    white-space: pre-wrap;
    margin-bottom: 14px;
  }

  .code-actions {
    display: flex;
    gap: 10px;
  }

  /* DEDICATED FULLSCREEN LEVEL MENU SCREEN */
  #menu-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1c29 0%, #10121a 100%);
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    color: #ffffff;
    overflow-y: auto;
  }

  #menu-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .menu-title-group {
    display: flex;
    flex-direction: column;
  }

  .menu-app-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(45deg, #007aff, #4cd964);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .menu-stats-badge {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 600;
    margin-top: 2px;
  }

  /* World Navigation Tabs */
  .world-tabs-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }

  .world-tabs-scroll::-webkit-scrollbar {
    display: none;
  }

  .world-tab-btn {
    flex: 0 0 auto;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .world-tab-btn.active {
    background: #208b98;
    color: #ffffff;
    border-color: #4cd964;
    box-shadow: 0 4px 12px rgba(32, 139, 152, 0.4);
  }

  /* Level Grid Cards */
  .level-menu-grid {
    display: grid;
    grid-template-columns: repeat( auto-fill, minmax(85px, 1fr) );
    gap: 14px;
    flex: 1;
    align-content: start;
    padding: 4px;
    margin-bottom: 20px;
  }

  .level-card {
    position: relative;
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s, border-color 0.2s;
  }

  .level-card.unlocked {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .level-card.selected {
    border-color: #4cd964;
    background: rgba(76, 217, 100, 0.2);
    transform: scale(1.06);
    box-shadow: 0 6px 18px rgba(76, 217, 100, 0.3);
  }

  .level-card.locked {
    opacity: 0.45;
    cursor: not-allowed;
    background: rgba(0, 0, 0, 0.2);
  }

  .level-card .lvl-number {
    font-size: 20px;
    font-weight: 900;
  }

  .level-card .lvl-stars {
    font-size: 11px;
    color: #ffd700;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .level-card .lock-icon {
    width: 22px;
    height: 22px;
    fill: rgba(255, 255, 255, 0.6);
  }

  /* Bottom Actions Bar in Menu */
  .menu-footer-actions {
    display: flex;
    gap: 12px;
    margin-top: auto;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Top Navigation UI -->
  <div id="top-ui">
    <div class="ui-group">
      <button class="ui-btn" id="restartBtn" title="Restart Level">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>

      <button class="ui-btn pwa-badge" id="pwaExportBtn" title="PWA Code & Export Files">
        <svg viewBox="0 0 24 24">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
      </button>

      <button class="ui-btn" id="pwaInstallBtn" title="Install Web App" style="display:none;">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h16v2H4zm2 5h12v2H6zm3 5h6v2H9z"/>
        </svg>
      </button>
    </div>

    <div id="progress-container">
      <span class="level-num" id="currentLevelText">1</span>
      <div id="progress-bar-bg">
        <div id="progress-bar-fill"></div>
        <div id="progress-player-dot"></div>
      </div>
      <span class="level-num" id="nextLevelText">2</span>
    </div>

    <button class="ui-btn" id="homeBtn" title="Level Select Menu">
      <svg viewBox="0 0 24 24">
        <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
      </svg>
    </button>
  </div>

  <!-- Dedicated Fullscreen Level Menu Screen -->
  <div id="menu-overlay">
    <div class="menu-header">
      <div class="menu-title-group">
        <div class="menu-app-title">STICKMAN HOOK</div>
        <div class="menu-stats-badge" id="menuStatsText">Unlocked: Level 1 / 50 • Total Stars: ⭐0</div>
      </div>
      <button class="ui-btn" id="closeMenuBtn" title="Resume Game">
        <svg viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <!-- World Level Tabs -->
    <div class="world-tabs-scroll" id="worldTabsContainer"></div>

    <!-- Level Cards Grid -->
    <div class="level-menu-grid" id="levelMenuGrid"></div>

    <!-- Menu Action Controls -->
    <div class="menu-footer-actions">
      <button class="primary-btn" id="startSelectedLevelBtn">PLAY SELECTED LEVEL</button>
    </div>
  </div>

  <div id="instruction-hint">HOLD / PRESS SPACE TO HOOK</div>
  <div id="level-banner">LEVEL 1</div>

  <!-- Win Overlay Modal -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <div class="modal-title">Level Cleared!</div>
      <div class="modal-subtitle" id="winSubtitle">Awesome swing technique!</div>
      <button class="primary-btn" id="nextLevelBtn">NEXT LEVEL</button>
      <button class="secondary-btn" id="winMenuBtn">LEVEL MENU</button>
    </div>
  </div>

  <!-- PWA Files Code & Export Modal -->
  <div class="modal-overlay" id="pwaModal">
    <div class="modal-card">
      <div class="modal-title">PWA Source Files</div>
      <div class="modal-subtitle">View, copy, or download the PWA files for external deployment.</div>
      
      <div class="pwa-tabs">
        <button class="pwa-tab-btn active" id="tabSwBtn">sw.js</button>
        <button class="pwa-tab-btn" id="tabManifestBtn">manifest.json</button>
      </div>

      <div class="code-container" id="codeDisplay"></div>

      <div class="code-actions">
        <button class="primary-btn" id="copyCodeBtn" style="background:var(--accent-blue)">Copy Code</button>
        <button class="primary-btn" id="downloadFileBtn">Download</button>
      </div>
      <button class="secondary-btn" id="closePwaModalBtn">CLOSE</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ==========================================================================
     PWA CODE GENERATION & SERVICE WORKER SETUP
     ========================================================================== */
  
  // 1. Service Worker Code Content
  const SW_CODE = `// Service Worker for Stickman Hook PWA
const CACHE_NAME = 'stickman-hook-pwa-v1';
const ASSETS_TO_CACHE = [
  './',
  './index.html'
];

// Install Event - Caching App Shell
self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => {
      console.log('[SW] Pre-caching offline assets');
      return cache.addAll(ASSETS_TO_CACHE);
    }).then(() => self.skipWaiting())
  );
});

// Activate Event - Cleaning Up Old Caches
self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((cacheNames) => {
      return Promise.all(
        cacheNames.map((cache) => {
          if (cache !== CACHE_NAME) {
            console.log('[SW] Removing old cache:', cache);
            return caches.delete(cache);
          }
        })
      );
    }).then(() => self.clients.claim())
  );
});

// Fetch Event - Cache First with Network Fallback
self.addEventListener('fetch', (event) => {
  event.respondWith(
    caches.match(event.request).then((cachedResponse) => {
      if (cachedResponse) {
        return cachedResponse;
      }
      return fetch(event.request).then((networkResponse) => {
        if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
          return networkResponse;
        }
        const responseToCache = networkResponse.clone();
        caches.open(CACHE_NAME).then((cache) => {
          cache.put(event.request, responseToCache);
        });
        return networkResponse;
      }).catch(() => {
        return caches.match('./');
      });
    })
  );
});`;

  // 2. Web App Manifest Content
  const MANIFEST_CODE = JSON.stringify({
    "name": "Stickman Hook PWA",
    "short_name": "StickmanHook",
    "description": "Swing, hook, and flip through exciting physics-based obstacle courses!",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#1a1a1a",
    "theme_color": "#208b98",
    "orientation": "portrait-primary",
    "icons": [
      {
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23208b98'><circle cx='50' cy='50' r='50'/><circle cx='50' cy='30' r='12' fill='%23fff'/><path d='M50 42 L50 75 M50 55 L30 40 M50 55 L70 40 M50 75 L35 95 M50 75 L65 95' stroke='%23fff' stroke-width='6' stroke-linecap='round'/></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  }, null, 2);

  // Register Web App Manifest dynamically via Data URI
  const manifestBlob = new Blob([MANIFEST_CODE], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  document.getElementById('manifest-link').setAttribute('href', manifestURL);

  // Register Service Worker dynamically via Blob URL
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const swBlob = new Blob([SW_CODE], { type: 'text/javascript' });
      const swURL = URL.createObjectURL(swBlob);

      navigator.serviceWorker.register(swURL, { scope: './' })
        .then((reg) => {
          console.log('PWA Service Worker registered successfully with scope:', reg.scope);
        })
        .catch((err) => {
          console.log('PWA Service Worker registration fallback:', err);
        });
    });
  }

  // Handle PWA Installation Prompt
  let deferredPrompt;
  const pwaInstallBtn = document.getElementById("pwaInstallBtn");
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    pwaInstallBtn.style.display = 'flex';
  });

  pwaInstallBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`User response to install prompt: ${outcome}`);
      deferredPrompt = null;
      pwaInstallBtn.style.display = 'none';
    }
  });

  const pwaModal = document.getElementById("pwaModal");
  const pwaExportBtn = document.getElementById("pwaExportBtn");
  const closePwaModalBtn = document.getElementById("closePwaModalBtn");
  const tabSwBtn = document.getElementById("tabSwBtn");
  const tabManifestBtn = document.getElementById("tabManifestBtn");
  const codeDisplay = document.getElementById("codeDisplay");
  const copyCodeBtn = document.getElementById("copyCodeBtn");
  const downloadFileBtn = document.getElementById("downloadFileBtn");

  let activeTab = "sw"; // 'sw' or 'manifest'

  function updatePwaCodeView() {
    if (activeTab === "sw") {
      tabSwBtn.classList.add("active");
      tabManifestBtn.classList.remove("active");
      codeDisplay.textContent = SW_CODE;
    } else {
      tabManifestBtn.classList.add("active");
      tabSwBtn.classList.remove("active");
      codeDisplay.textContent = MANIFEST_CODE;
    }
  }

  pwaExportBtn.addEventListener("click", () => {
    updatePwaCodeView();
    pwaModal.classList.add("active");
  });

  closePwaModalBtn.addEventListener("click", () => {
    pwaModal.classList.remove("active");
  });

    URL.revokeObjectURL(url);
  });

  /* ==========================================================================
     AUDIO SYNTHESIZER (Web Audio API - Pure JS, No External Assets)
     ========================================================================== */
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playHookSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch(e) {}
  }

  function playBounceSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(520, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
  }

  function playWinSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.07);
        osc.stop(ctx.currentTime + idx * 0.07 + 0.25);
      });
    } catch(e) {}
  }

  function playFailSound() {
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch(e) {}
  }

  const THEMES = [
    { skyTop: "#208b98", skyBottom: "#52ab98", cloud: "#78c2ad" }, // Teal
    { skyTop: "#4e7729", skyBottom: "#7ca942", cloud: "#a1cb64" }, // Olive Green
    { skyTop: "#7b4397", skyBottom: "#dc2430", cloud: "#e46870" }, // Purple Pink
    { skyTop: "#2b5876", skyBottom: "#4e4376", cloud: "#7268a6" }, // Deep Blue

  let trampolines = [];
  let hazards = [];
  let targetHook = null;
  let particles = [];
  let cameraX = 0;

  const GRAVITY = 1500;
  const player = {
    x: 100,

    vx: 380,
    vy: 0,

    anchor: null,
    ropeLength: 0,

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";

  }
  window.addEventListener("resize", resizeCanvas);

  function saveProgress() {
    localStorage.setItem('stickman_unlocked_level', maxUnlockedLevel.toString());
    localStorage.setItem('stickman_stars_map', JSON.stringify(levelStarsMap));
  }

  function generateLevel(levelIdx) {
    hooks = [];
    trampolines = [];
    hazards = [];
    particles = [];
    
    currentLevelIndex = levelIdx;
    levelLength = 3200 + levelIdx * 650;
    startPos = { x: 120, y: H * 0.45 };
    finishX = levelLength - 200;

    player.x = startPos.x;
    player.y = startPos.y;
    player.vx = 340;
    player.vy = -50;
    player.attached = false;
    player.anchor = null;
    player.trail = [];
    player.bodyAngle = 0;

    let theme = THEMES[levelIdx % THEMES.length];
    document.documentElement.style.setProperty('--bg-theme', theme.skyTop);

    let baseSpacing = 180 + Math.min(levelIdx * 8, 140);
    let spacingVar = 60 + Math.min(levelIdx * 10, 180);
    let movingHookChance = Math.min(levelIdx * 0.08, 0.65);
    let trampolineChance = Math.max(0.18, 0.75 - levelIdx * 0.025);
    let hazardChance = levelIdx >= 3 ? Math.min((levelIdx - 2) * 0.12, 0.55) : 0;

    let currX = 280;

    while (currX < finishX - 220) {
      let spacing = baseSpacing + Math.random() * spacingVar;
      currX += spacing;

      let heightVariance = Math.min(0.22 + levelIdx * 0.015, 0.42);
      let hookY = H * (0.18 + Math.random() * heightVariance);

      let isMoving = Math.random() < movingHookChance;
      let moveSpeed = 40 + Math.random() * (40 + Math.min(levelIdx * 10, 100));
      let moveRange = 50 + Math.random() * 70;

      hooks.push({
        x: currX,
        y: hookY,
        baseY: hookY,
        radius: 14,
        isMoving: isMoving,
        moveSpeed: moveSpeed,
        moveRange: moveRange,
        movePhase: Math.random() * Math.PI * 2
      });

      if (hazardChance > 0 && Math.random() < hazardChance && currX < finishX - 400) {
        let hazWidth = 70 + Math.random() * (60 + Math.min(levelIdx * 5, 80));
        let hazY = hookY + 140 + Math.random() * 80;
        if (hazY < H - 80) {
          hazards.push({
            x: currX - hazWidth / 2,
            y: hazY,
            w: hazWidth,
            h: 22
          });
        }
      }

      if (Math.random() < trampolineChance || currX > finishX - 350) {
        let trampX = currX + (Math.random() * 60 - 30);
        let trampY = Math.min(H - 80, hookY + 230 + Math.random() * 70);
        let trampW = Math.max(50, 95 - levelIdx * 1.5);
        trampolines.push({
          x: trampX - trampW / 2,
          y: trampY,
          w: trampW,
          h: 18,
          squish: 0
        });
      }
    }

    trampolines.unshift({
      x: startPos.x - 40,
      y: startPos.y + 120,
      w: 120,
      h: 18,
      squish: 0
    });

    currentLevelText.textContent = levelIdx + 1;
    nextLevelText.textContent = levelIdx + 2;
    updateProgressBar(0);
    showLevelBanner(levelIdx);

    gameState = "PLAYING";
    menuOverlay.classList.remove("active");
    winModal.classList.remove("active");
  }

  function openLevelMenu(worldIdx) {
    gameState = "MENU";
    if (worldIdx !== undefined) {
      currentWorldTab = worldIdx;
    } else {
      currentWorldTab = Math.floor(currentLevelIndex / 10);
    }
    selectedMenuLevel = currentLevelIndex;

    renderWorldTabs();
    renderLevelGrid();
    updateMenuStats();

    menuOverlay.classList.add("active");
  }

  function closeLevelMenu() {
    if (gameState === "MENU") {
      generateLevel(selectedMenuLevel);
    } else {
      menuOverlay.classList.remove("active");
    }
  }

  function renderWorldTabs() {
    worldTabsContainer.innerHTML = "";
    const TOTAL_WORLDS = 5; // 50 levels total (10 per world)

    for (let w = 0; w < TOTAL_WORLDS; w++) {
      let btn = document.createElement("button");
      btn.className = "world-tab-btn" + (w === currentWorldTab ? " active" : "");
      let startLvl = w * 10 + 1;
      let endLvl = (w + 1) * 10;
      btn.textContent = `World ${w + 1} (${startLvl}-${endLvl})`;

      btn.onclick = () => {
        currentWorldTab = w;
        renderWorldTabs();
        renderLevelGrid();
      };
      worldTabsContainer.appendChild(btn);
    }
  }

  function renderLevelGrid() {
    levelMenuGrid.innerHTML = "";
    let startIdx = currentWorldTab * 10;
    let endIdx = startIdx + 10;

    for (let i = startIdx; i < endIdx; i++) {
      let isUnlocked = i <= maxUnlockedLevel;
      let card = document.createElement("div");
      card.className = "level-card" + 
        (isUnlocked ? " unlocked" : " locked") + 
        (i === selectedMenuLevel ? " selected" : "");

      if (isUnlocked) {
        let numSpan = document.createElement("div");
        numSpan.className = "lvl-number";
        numSpan.textContent = i + 1;
        card.appendChild(numSpan);

        let stars = levelStarsMap[i] || 3;
        let starSpan = document.createElement("div");
        starSpan.className = "lvl-stars";
        starSpan.textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
        card.appendChild(starSpan);

        card.onclick = (e) => {
          e.stopPropagation();
          selectedMenuLevel = i;
          renderLevelGrid();
        };

        card.ondblclick = (e) => {
          e.stopPropagation();
          selectedMenuLevel = i;
          generateLevel(selectedMenuLevel);
        };
      } else {
        card.innerHTML = `<svg class="lock-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>`;
      }

      levelMenuGrid.appendChild(card);

    startSelectedLevelBtn.textContent = `PLAY LEVEL ${selectedMenuLevel + 1}`;

  function updateMenuStats() {
    let totalStars = 0;
    Object.values(levelStarsMap).forEach(s => totalStars += s);
    menuStatsText.textContent = `Unlocked: Level ${maxUnlockedLevel + 1} / 50 • Total Stars: ⭐${totalStars}`;
  }

  function findClosestAheadHook() {
    let best = null;
    let minDistance = Infinity;

    for (const h of hooks) {
      let dx = h.x - player.x;
      let dy = h.y - player.y;
      let dist = Math.hypot(dx, dy);

      if (dx > -60 && dist < 450 && dist < minDistance) {
        minDistance = dist;
        best = h;
      }
    }
    return best;
  }

  function attachHook() {
    let target = findClosestAheadHook();
    if (!target) return;

    let dx = player.x - target.x;
    let dy = player.y - target.y;
    let rope = Math.hypot(dx, dy);
    let angle = Math.atan2(dx, dy);

    let angVel = (player.vx * Math.cos(angle) - player.vy * Math.sin(angle)) / Math.max(rope, 40);

    player.attached = true;
    player.anchor = target;
    player.ropeLength = rope;
    player.angle = angle;
    player.angularVelocity = angVel;

    spawnParticles(player.x, player.y, "#ffffff", 8);
    playHookSound();
  }

  function detachHook() {
    if (!player.attached) return;

    let a = player.angle;
    let av = player.angularVelocity;
    let r = player.ropeLength;

    player.vx = r * Math.cos(a) * av * 1.08;
    player.vy = -r * Math.sin(a) * av * 1.08;

    player.attached = false;
    player.anchor = null;
  }

  function onPointerDown(e) {
    if (gameState !== "PLAYING" && gameState !== "DEAD") return;
    if (e && e.target.closest && e.target.closest("#top-ui, .modal-overlay, #menu-overlay")) return;

    isPointerDown = true;
    instructionHint.style.opacity = "0";

    if (gameState === "DEAD") {
      generateLevel(currentLevelIndex);
      return;
    }

    if (gameState === "PLAYING" && !player.attached) {
      attachHook();
    }
  }

  function onPointerUp() {
    isPointerDown = false;
    if (player.attached) {
      detachHook();
    }
  }

  window.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (!isPointerDown) onPointerDown();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") onPointerUp();
  });

  restartBtn.addEventListener("click", () => generateLevel(currentLevelIndex));
  homeBtn.addEventListener("click", () => openLevelMenu());
  closeMenuBtn.addEventListener("click", closeLevelMenu);
  startSelectedLevelBtn.addEventListener("click", () => generateLevel(selectedMenuLevel));

  nextLevelBtn.addEventListener("click", () => {
    currentLevelIndex++;
    generateLevel(currentLevelIndex);
  });
  
  if (winMenuBtn) {
    winMenuBtn.addEventListener("click", () => {
      winModal.classList.remove("active");
      openLevelMenu();
    });
  }

  function showLevelBanner(levelIdx) {
    const banner = document.getElementById("level-banner");
    banner.textContent = "LEVEL " + (levelIdx + 1);
    banner.classList.add("show");
    setTimeout(() => {
      banner.classList.remove("show");
    }, 1800);
  }

  let lastTime = performance.now();

  function update(dt) {
    animTime += dt;
    dashedRingAngle += dt * 3;

    for (let h of hooks) {
      if (h.isMoving) {
        h.movePhase += dt * (h.moveSpeed / 40);
        h.y = h.baseY + Math.sin(h.movePhase) * h.moveRange;
      }
    }

    if (gameState === "PLAYING") {
      targetHook = findClosestAheadHook();

      if (player.attached) {
        let r = player.ropeLength;
        let angAcc = -(GRAVITY / r) * Math.sin(player.angle);

        player.angularVelocity += angAcc * dt;
        player.angularVelocity *= 0.9992;
        player.angle += player.angularVelocity * dt;

        player.x = player.anchor.x + r * Math.sin(player.angle);
        player.y = player.anchor.y + r * Math.cos(player.angle);

        player.vx = r * Math.cos(player.angle) * player.angularVelocity;
        player.vy = -r * Math.sin(player.angle) * player.angularVelocity;
        player.bodyAngle = player.angle;

        if (!isPointerDown) {
          detachHook();
        }
      } else {
        player.vy += GRAVITY * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        if (player.vx < 260) player.vx += 100 * dt;

        player.bodyAngle = Math.atan2(player.vy, player.vx);

        if (isPointerDown) {
          attachHook();
        }
      }

      player.trail.push({ x: player.x, y: player.y });
      if (player.trail.length > 8) player.trail.shift();

      for (let t of trampolines) {
        if (t.squish > 0) t.squish = Math.max(0, t.squish - dt * 4);

        if (
          player.vy > 0 &&
          player.x >= t.x - 10 &&
          player.x <= t.x + t.w + 10 &&
          player.y + player.radius >= t.y &&
          player.y - player.radius <= t.y + t.h
        ) {
          player.vy = -Math.max(780, Math.abs(player.vy) * 0.95);
          player.vx = Math.max(player.vx * 1.05, 360);
          player.y = t.y - player.radius;
          t.squish = 1;
          spawnParticles(player.x, t.y, "#ffffff", 12);
          playBounceSound();
          if (player.attached) detachHook();
        }
      }

      for (let hz of hazards) {
        if (
          player.x + player.radius > hz.x &&
          player.x - player.radius < hz.x + hz.w &&
          player.y + player.radius > hz.y &&
          player.y - player.radius < hz.y + hz.h
        ) {
          spawnParticles(player.x, player.y, "#ff4444", 25);
          playFailSound();
          gameState = "DEAD";
          setTimeout(() => {
            if (gameState === "DEAD") generateLevel(currentLevelIndex);
          }, 450);
          break;
        }
      }

      if (player.y > H + 100) {
        playFailSound();
        gameState = "DEAD";
        setTimeout(() => {
          if (gameState === "DEAD") generateLevel(currentLevelIndex);
        }, 500);
      }

      if (player.x >= finishX) {
        gameState = "WIN";
        spawnParticles(finishX, H * 0.4, "#ffffff", 40);
        playWinSound();

        // Save progress & Stars
        if (currentLevelIndex >= maxUnlockedLevel) {
          maxUnlockedLevel = Math.min(49, currentLevelIndex + 1);
        }
        levelStarsMap[currentLevelIndex] = 3; // 3 stars upon completion
        saveProgress();

        setTimeout(() => {
          winModal.classList.add("active");
        }, 400);
      }

      let targetCamX = player.x - W * 0.28;
      cameraX += (targetCamX - cameraX) * 0.1;

      let progress = Math.min(1, Math.max(0, (player.x - startPos.x) / (finishX - startPos.x)));
      updateProgressBar(progress);
    }

    for (let p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  function updateProgressBar(progress) {
    let pct = (progress * 100).toFixed(1) + "%";
    progressBarFill.style.width = pct;
    progressPlayerDot.style.left = pct;
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      let ang = Math.random() * Math.PI * 2;
      let spd = 50 + Math.random() * 220;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.8,
        color: color
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    let theme = THEMES[currentLevelIndex % THEMES.length];

    let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, theme.skyTop);
    skyGrad.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    drawClouds(theme.cloud);

    ctx.save();
    ctx.translate(-cameraX, 0);

    drawFinishLine();
    drawTrampolines();
    drawHazards();
    drawHooks();

    if (player.attached && player.anchor) {
      ctx.beginPath();
      ctx.moveTo(player.anchor.x, player.anchor.y);
      ctx.lineTo(player.x, player.y);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    for (let i = 0; i < player.trail.length; i++) {
      let p = player.trail[i];
      let alpha = (i / player.trail.length) * 0.35;
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, player.radius * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    drawStickman();

    for (let p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function drawClouds(cloudColor) {
    ctx.fillStyle = cloudColor;
    ctx.globalAlpha = 0.5;

    let cloudCamX = cameraX * 0.25;
    ctx.beginPath();
    let step = 140;
    let startI = Math.floor(cloudCamX / step) - 1;
    let endI = startI + Math.ceil(W / step) + 3;

    ctx.moveTo(-50, H);
    for (let i = startI; i <= endI; i++) {
      let cx = i * step - cloudCamX;
      let cy = H - 120 + Math.sin(i * 1.5) * 20;
      ctx.quadraticCurveTo(cx, cy - 60, cx + step / 2, cy);
    }
    ctx.lineTo(W + 50, H);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawHooks() {
    for (let h of hooks) {
      let isCurrentAnchor = player.attached && player.anchor === h;
      let isTargetCandidate = !player.attached && targetHook === h;

      if (h.isMoving) {
        ctx.beginPath();
        ctx.moveTo(h.x, h.baseY - h.moveRange);
        ctx.lineTo(h.x, h.baseY + h.moveRange);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (isCurrentAnchor || isTargetCandidate) {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(dashedRingAngle);
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
      ctx.strokeStyle = h.isMoving ? "#ffea79" : "#ffffff";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(h.x, h.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = h.isMoving ? "#ffea79" : "#ffffff";
      ctx.fill();
    }
  }

  function drawHazards() {
    for (let hz of hazards) {
      ctx.save();
      let glow = Math.sin(animTime * 8) * 0.2 + 0.8;
      ctx.fillStyle = `rgba(235, 60, 60, ${glow})`;
      roundRect(ctx, hz.x, hz.y, hz.w, hz.h, 6);
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let sx = hz.x + 6; sx < hz.x + hz.w - 6; sx += 12) {
        ctx.moveTo(sx, hz.y + 4);
        ctx.lineTo(sx + 6, hz.y + hz.h - 4);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawTrampolines() {
    for (let t of trampolines) {
      ctx.save();
      ctx.translate(t.x + t.w / 2, t.y + t.h / 2);

      let squishY = 1 - t.squish * 0.45;
      let squishX = 1 + t.squish * 0.2;
      ctx.scale(squishX, squishY);

      ctx.beginPath();
      roundRect(ctx, -t.w / 2, -t.h / 2, t.w, t.h, 9);
      ctx.fillStyle = "#e0e0e0";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-t.w / 2 + 8, -t.h / 2 + 3);
      ctx.lineTo(t.w / 2 - 8, -t.h / 2 + 3);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.restore();
    }
  }

  function drawFinishLine() {
    let fx = finishX;
    let topY = H * 0.15;
    let botY = H - 60;

    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(fx, topY);
    ctx.lineTo(fx, botY);
    ctx.stroke();

    let squareSize = 16;
    for (let y = topY; y < botY; y += squareSize) {
      let isWhite = Math.floor(y / squareSize) % 2 === 0;
      ctx.fillStyle = isWhite ? "#ffffff" : "#333333";
      ctx.fillRect(fx - 8, y, squareSize, squareSize);
    }
  }

  function drawStickman() {
    ctx.save();
    ctx.translate(player.x, player.y);

    let rot = player.attached ? player.angle : player.bodyAngle * 0.5;
    ctx.rotate(rot);

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    let cycle = Math.sin(animTime * 15);
    let legBend = player.attached ? 6 : cycle * 8;

    ctx.beginPath();
    ctx.arc(0, -14, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#000000";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, -7);
    ctx.lineTo(0, 8);
    ctx.stroke();

    ctx.beginPath();
    if (player.attached) {
      ctx.moveTo(0, -4);
      ctx.lineTo(-6, -16);
      ctx.moveTo(0, -4);
      ctx.lineTo(6, -16);
    } else {
      ctx.moveTo(0, -4);
      ctx.lineTo(-10, 2 + cycle * 4);
      ctx.moveTo(0, -4);
      ctx.lineTo(10, 2 - cycle * 4);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.lineTo(-7 - legBend, 20);
    ctx.moveTo(0, 8);
    ctx.lineTo(7 + legBend, 20);
    ctx.stroke();

    ctx.restore();
  }

  function roundRect(context, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;

    if (typeof context.roundRect === 'function') {
      context.roundRect(x, y, w, h, r);
      return;
    }

    context.moveTo(x + r, y);
    context.arcTo(x + w, y, x + w, y + h, r);
    context.arcTo(x + w, y + h, x, y + h, r);
    context.arcTo(x, y + h, x, y, r);
    context.arcTo(x, y, x + w, y, r);
    context.closePath();
  }

  function gameLoop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.033);

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
  }

  // Initial setup: Open Level Menu on startup
  openLevelMenu();
  requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
